# Guards the one invariant the worksheet kit must never break:
#
#   The published book must never contain a worksheet.
#
# The kit stays out of the book because worksheets/ carries its own
# _quarto.yml, and Quarto excludes a sub-directory that is its own project
# from the parent project. That is a convention, not a lock — a stray
# worksheet .qmd at the repo root, or a change to either _quarto.yml, would
# silently start publishing internal worksheets to Daniel's handbook site.
#
# This runs on anything that could plausibly break it, and fails loudly.
# It deliberately does NOT modify publish.yml, so the book's own publishing
# path is untouched.

name: Worksheet isolation

on:
  push:
    paths:
      - '_quarto.yml'
      - 'worksheets/**'
      - '*.qmd'
      - '.github/skills/worksheet-build/**'
  # This check is required on main. Required checks that are skipped by path
  # filtering stay pending and block unrelated pull requests, so every pull
  # request must report an isolation result.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: The book project must contain no worksheet inputs
        run: |
          set -euo pipefail

          quarto inspect . > root-inspect.json

          # jq, not a heredoc: an indented heredoc terminator does not close
          # the heredoc, and the step fails in a way that looks like a Quarto
          # problem rather than a shell one.
          leaked="$(jq -r '.files.input[]' root-inspect.json \
                      | tr '\\' '/' | grep -i '/worksheets/' || true)"

          if [ -n "$leaked" ]; then
            echo "::error::Worksheet files have leaked into the published book project:"
            printf '%s\n' "$leaked"
            echo ""
            echo "worksheets/_quarto.yml should make Quarto treat worksheets/ as a"
            echo "separate project. Check it still exists and that no worksheet .qmd"
            echo "has been added at the repository root."
            exit 1
          fi

          total="$(jq -r '.files.input | length' root-inspect.json)"
          echo "OK: the book project has $total inputs, none of them a worksheet."

      - name: The worksheet project must still render
        run: |
          set -euo pipefail
          cd worksheets
          quarto render specimen.qmd
          test -f _output/specimen.html
          echo "OK: the worksheet project renders independently."

      - name: Set up the layout gate
        working-directory: .github/skills/worksheet-build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: The gate must still catch a deliberately broken worksheet
        # A gate that passes everything is worse than no gate, because it
        # manufactures confidence. This breaks one house rule at a time against
        # the known-good specimen and fails if any defect goes undetected.
        run: node .github/skills/worksheet-build/scripts/gate-mutation-test.mjs

      - name: The build stage must be told the right worksheet for every trigger
        # The build agent once read a stale request file instead of its own
        # dispatch input, and spent a run on a worksheet that had already
        # shipped. The ws_id is now resolved by a deterministic step; this
        # proves it follows the trigger that fired, accepts every real spec,
        # and refuses rather than guesses.
        run: bash .github/skills/worksheet-build/scripts/resolve-build-request.test.sh
