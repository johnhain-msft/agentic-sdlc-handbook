on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to gh-pages (main only). Untick to build the PDF and EPUB and upload them as an artifact, without deploying."
        type: boolean
        default: true
  push:
    branches: main
    # Only changes that can alter the book. Worksheet merges, their build
    # specs and the factory's own files leave the site as it was, so they do
    # not spend a PDF build.
    paths:
      - '**'
      - '!worksheets/**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/publish.yml'

name: Quarto Publish

# Deploys run one at a time, so two runs never write gh-pages at once. A newer
# run queueing behind a waiting one replaces it, which loses nothing: it builds
# a later main. A build-only run gets a group of its own, so a test never holds
# up a deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) && 'gh-pages-deploy' || format('build-only-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # The web book. Fast, so the site never waits for the PDF.
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML
        run: quarto render --to html

      # quarto publish replaces everything on gh-pages, so carry the current
      # PDF and EPUB across; deploy-downloads replaces them once this run's are
      # built. Never write an empty file: `git show ... > f || echo` used to
      # create a zero-byte download whenever gh-pages had none.
      - name: Keep the current PDF and EPUB
        run: |
          git fetch origin gh-pages || {
            echo "::error::This repository has no gh-pages branch. Push an empty one first; quarto publish needs it to exist."
            exit 1
          }
          for f in The-Agentic-SDLC-Handbook.pdf The-Agentic-SDLC-Handbook.epub; do
            size="$(git cat-file -s "origin/gh-pages:$f" 2>/dev/null || echo 0)"
            if [ "$size" -gt 0 ]; then
              git show "origin/gh-pages:$f" > "_book/$f"
              echo "kept $f ($size bytes)"
            else
              echo "::warning::$f is not on gh-pages yet; deploy-downloads will publish it."
            fi
          done

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The PDF and EPUB. Every Mermaid diagram becomes a PNG through a headless
  # browser, which makes this the slow job. In March 2026 that step hung on CI,
  # with the deprecated `quarto install chromium` browser, and one run sat for
  # six hours. So every step has a ceiling, and a one-diagram smoke test fails
  # in minutes if the browser cannot render at all.
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Quarto's recommended headless browser for CI since 1.9.
      - name: Install Chrome Headless Shell
        run: quarto install chrome-headless-shell --no-prompt

      - name: Report the toolchain
        run: quarto check install || true

      - name: Smoke-test one diagram
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p diagram-smoke && cd diagram-smoke
          printf '%s\n' '---' 'title: Diagram smoke test' 'format: pdf' '---' '' \
            '```{mermaid}' 'flowchart LR' '  A --> B' '```' > smoke.qmd
          quarto render smoke.qmd
          test -s smoke.pdf

      - name: Render PDF
        timeout-minutes: 25
        run: |
          quarto render --to pdf
          # The EPUB render clears _book/.
          cp _book/The-Agentic-SDLC-Handbook.pdf "$RUNNER_TEMP/"

      - name: Render EPUB
        timeout-minutes: 20
        run: |
          quarto render --to epub
          cp "$RUNNER_TEMP/The-Agentic-SDLC-Handbook.pdf" _book/

      # After the renders, so the pre-render hook does not see this Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A guard, not a fix. The download chapter is the web book's email form,
      # and Quarto already leaves it out of both files: the first CI build found
      # nothing to strip. This removes it if it ever comes back.
      - name: Strip the download chapter
        run: |
          python -m pip install --quiet pymupdf
          python scripts/strip-blank-page.py _book/The-Agentic-SDLC-Handbook.pdf
          python scripts/strip-blank-page.py _book/The-Agentic-SDLC-Handbook.epub

      - name: Check both files are real
        run: |
          for f in _book/The-Agentic-SDLC-Handbook.pdf _book/The-Agentic-SDLC-Handbook.epub; do
            size="$(stat -c %s "$f")"
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes."
              exit 1
            fi
          done

      - name: Upload the PDF and EPUB
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: |
            _book/The-Agentic-SDLC-Handbook.pdf
            _book/The-Agentic-SDLC-Handbook.epub
          if-no-files-found: error
          retention-days: 7

  # After the web book, so its publish cannot overwrite these files.
  deploy-downloads:
    needs: [build-deploy, downloads]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the PDF and EPUB
        uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Publish the PDF and EPUB
        working-directory: site
        run: |
          cp ../downloads/The-Agentic-SDLC-Handbook.pdf ../downloads/The-Agentic-SDLC-Handbook.epub .
          git add The-Agentic-SDLC-Handbook.pdf The-Agentic-SDLC-Handbook.epub
          if git diff --cached --quiet; then
            echo "gh-pages already has these files."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build PDF and EPUB from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
