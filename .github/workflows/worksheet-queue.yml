# Worksheet factory queue.
#
# Starts the next queued worksheet whenever the factory is free, so a person
# only has to review and merge: merging a worksheet pull request starts the
# next build. A 6-hourly sweep is the backstop.
#
# A worksheet issue enters the queue labelled `worksheet-queued`, with a
# `ws_id:` line naming its build spec. promote-queue.sh first reconciles the
# issues already in flight: it closes the ones whose worksheet is on main, and
# flags needs-human any left with no pull request and no build running. Then
# it relabels the oldest queued issue `stage:build` and dispatches
# aw-worksheet-build for it. It dispatches because a label applied with
# GITHUB_TOKEN never starts a workflow run.
#
# Every run does the whole job and reads nothing from its event, so it does
# not matter which trigger fired, or that GitHub drops a pending run when a
# newer one queues behind it.
#
# Triggers:
#   push to main under worksheets/   a worksheet merged: close its issue, start the next
#   worksheet-queued label           a worksheet joins the queue
#   closing a stage:build issue      a person dropped a worksheet: start the next
#   schedule, every 6 hours          the backstop, e.g. a build that opened no pull request
#   workflow_dispatch                by hand
#
# Deliberately no pull_request trigger. For a pull request closed without
# merging, GitHub takes the workflow file from that pull request's merge ref,
# which can lag main: #13's still carried the pre-reconcile queue after the
# reconciling one merged. Every trigger above uses the copy on main, except a
# dispatch, which uses the branch it is run on.
#
# ONE worksheet at a time. Dispatched runs of a stage share one concurrency
# group and cancel each other, so two pull requests in the stages at once would
# strand one. Raise MAX_IN_FLIGHT only after giving each pull request its own
# group.
#
# Plain Actions, not agentic: counting what is in flight and picking the oldest
# issue is deterministic work that should not cost a model call.

name: Worksheet queue

on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
  issues:
    types: [labeled, closed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  # To dispatch the build: a label alone never starts it. Also to read runs.
  actions: write
  # To read the resolver, the build specs, and which worksheets are on main.
  contents: read

concurrency:
  group: worksheet-queue
  cancel-in-progress: false

jobs:
  dispatch-next:
    # Of issue events, only a worksheet joining the queue or an issue that held
    # a slot closing can change what the queue should do.
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'labeled' && github.event.label.name == 'worksheet-queued') ||
      (github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'stage:build'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # Explicitly main: "already built" means already on main.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/skills/worksheet-build/scripts
            docs/worksheets
            worksheets

      - name: Start the next queued worksheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_IN_FLIGHT: 1
          # Absent on schedule events; the script then defaults to main.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/skills/worksheet-build/scripts/promote-queue.sh
